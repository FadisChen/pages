<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>icon-source</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0d; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="icon"></canvas>
<script>
function getParam(name, fallback) {
  const v = new URLSearchParams(location.search).get(name);
  return v === null ? fallback : v;
}

const size = parseInt(getParam('size', '512'), 10);
const marginRatio = parseFloat(getParam('margin', '0.18'));
const gridCount = parseInt(getParam('grid', '40'), 10);
const simple = getParam('simple', '0') === '1';

const canvas = document.getElementById('icon');
canvas.width = size;
canvas.height = size;
const ctx = canvas.getContext('2d');

// Opaque background required — iOS renders transparent icon pixels as
// solid black, so bake the real background color in at generation time.
ctx.fillStyle = '#0b0b0d';
ctx.fillRect(0, 0, size, size);

const cx = size / 2;
const cy = size / 2;
const radius = (size / 2) * (1 - marginRatio);

ctx.fillStyle = '#f4f4f5';

if (simple) {
  // Fine dot texture turns to mush at very small sizes (e.g. 32px favicon);
  // fall back to a plain solid disc for legibility.
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
} else {
  // Same "sample brightness per cell -> area-proportional dot radius"
  // approach as script.js's renderHalftone(), applied to a synthetic
  // circle mask instead of a camera frame, so the icon shares the app's
  // own visual language.
  const cellSize = size / gridCount;
  const maxDotR = (cellSize / 2) * 1.05;
  const softStart = radius * 0.8;
  const softEnd = radius * 1.02;

  for (let gy = 0; gy < gridCount; gy++) {
    for (let gx = 0; gx < gridCount; gx++) {
      const px = (gx + 0.5) * cellSize;
      const py = (gy + 0.5) * cellSize;
      const dist = Math.hypot(px - cx, py - cy);

      let t;
      if (dist <= softStart) t = 1;
      else if (dist >= softEnd) t = 0;
      else t = 1 - (dist - softStart) / (softEnd - softStart);

      if (t <= 0.02) continue;
      const r = maxDotR * Math.sqrt(t);
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

document.title = 'icon-ready';
</script>
</body>
</html>
