<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>韓國旅遊韓語小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  [hidden]{display:none !important;}

  :root{
    --paper:#faf6ef;
    --surface:#fffcf7;
    --ink:#241f2e;
    --ink-soft:#6b6478;
    --ink-faint:#9b93a8;
    --accent:#1f8f78;
    --accent-soft:#dff3ee;
    --accent-ink:#0d5445;
    --coral:#e05a3d;
    --coral-soft:#fbe4dc;
    --line:rgba(36,31,46,.14);
    --line-strong:rgba(36,31,46,.26);
    --shadow:0 1px 2px rgba(36,31,46,.06),0 8px 24px -12px rgba(36,31,46,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#171320;
      --surface:#211c2c;
      --ink:#f3ece2;
      --ink-soft:#bfb6cf;
      --ink-faint:#847c96;
      --accent:#4fcdaf;
      --accent-soft:#1c332e;
      --accent-ink:#9df0dd;
      --coral:#ff8163;
      --coral-soft:#3a2620;
      --line:rgba(243,236,226,.16);
      --line-strong:rgba(243,236,226,.28);
      --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#171320;
    --surface:#211c2c;
    --ink:#f3ece2;
    --ink-soft:#bfb6cf;
    --ink-faint:#847c96;
    --accent:#4fcdaf;
    --accent-soft:#1c332e;
    --accent-ink:#9df0dd;
    --coral:#ff8163;
    --coral-soft:#3a2620;
    --line:rgba(243,236,226,.16);
    --line-strong:rgba(243,236,226,.28);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px -12px rgba(0,0,0,.6);
  }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","Noto Sans",-apple-system,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }

  header.page-header{
    padding:20px 16px 12px;
    max-width:880px;
    margin:0 auto;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  header.page-header h1{
    font-size:1.35rem;
    font-weight:900;
    margin:0 0 4px;
  }
  header.page-header p{
    margin:0;
    color:var(--ink-soft);
    font-size:.88rem;
  }
  .theme-toggle{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    border-radius:999px;
    padding:8px 14px;
    font-size:.85rem;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .theme-toggle:hover{border-color:var(--line-strong);}

  #tts-banner{
    max-width:880px;
    margin:0 auto 8px;
    padding:0 16px;
  }
  #tts-banner .banner-inner{
    background:var(--coral-soft);
    color:var(--coral);
    border-radius:10px;
    padding:10px 14px;
    font-size:.85rem;
  }

  .tab-bar{
    max-width:880px;
    margin:0 auto;
    padding:4px 16px 10px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .tab-bar::-webkit-scrollbar{height:0;}
  .tab-btn{
    flex:0 0 auto;
    scroll-snap-align:start;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    padding:9px 16px;
    border-radius:999px;
    font-size:.88rem;
    font-family:inherit;
    white-space:nowrap;
    cursor:pointer;
  }
  .tab-btn:hover{border-color:var(--line-strong);color:var(--ink);}
  .tab-btn.is-active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  main{
    max-width:880px;
    margin:0 auto;
    padding:0 16px;
  }
  .tab-panel{display:none;}
  .tab-panel.is-active{display:block;}

  .panel-intro{
    color:var(--ink-soft);
    font-size:.9rem;
    margin:4px 0 16px;
    padding:12px 14px;
    background:var(--accent-soft);
    border-radius:10px;
  }
  .subsection-title{
    font-size:1rem;
    font-weight:700;
    margin:20px 0 10px;
    color:var(--ink);
  }
  .subsection-title:first-of-type{margin-top:4px;}

  .phrase-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:8px;
  }
  @media (min-width:520px){
    .phrase-grid{grid-template-columns:1fr 1fr;}
  }
  .hangul-grid{
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  }

  .phrase-card{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    width:100%;
    min-height:56px;
    text-align:left;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    font-family:inherit;
    color:var(--ink);
    transition:transform .1s ease, border-color .15s ease;
  }
  .phrase-card:hover{border-color:var(--accent);}
  .phrase-card:active{transform:scale(.98);}
  .phrase-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .phrase-card.is-speaking{border-color:var(--accent);background:var(--accent-soft);}

  .phrase-tag{
    display:inline-block;
    font-size:.72rem;
    font-weight:700;
    color:var(--accent-ink);
    background:var(--accent-soft);
    padding:2px 8px;
    border-radius:999px;
    margin-bottom:2px;
  }
  .phrase-zh{
    font-size:.85rem;
    color:var(--ink-soft);
  }
  .phrase-ko{
    font-family:"Noto Sans KR","Noto Sans TC",sans-serif;
    font-size:1.35rem;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .speaker-icon{font-size:1rem;opacity:.8;}
  .phrase-ro{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:.78rem;
    color:var(--ink-faint);
  }

  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-size:.85rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:20;
    max-width:90vw;
    text-align:center;
  }
  #toast.is-visible{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  footer.page-footer{
    max-width:880px;
    margin:24px auto 0;
    padding:0 16px;
    color:var(--ink-faint);
    font-size:.78rem;
  }
</style>
</head>
<body>

<header class="page-header">
  <div>
    <h1>🇰🇷 韓國旅遊韓語小幫手</h1>
    <p>點一下卡片，立刻用語音念出韓文發音</p>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切換深色／淺色模式">🌓 主題</button>
</header>

<div id="tts-banner" hidden>
  <div class="banner-inner" role="status"></div>
</div>

<div class="tab-bar" role="tablist" aria-label="學習情境分類" id="tab-bar"></div>

<main id="tab-panels"></main>

<footer class="page-footer">
  資料僅供旅遊隨身參考；發音以裝置內建的韓文語音合成播放，實際腔調請以真人教學或當地人為準。
</footer>

<div id="toast" role="status" aria-live="polite"></div>

    ],
    vowels:[
      { tag:'ㅏ', zh:'示範音節', ko:'아', ro:'a' },
      { tag:'ㅑ', zh:'示範音節', ko:'야', ro:'ya' },
      { tag:'ㅓ', zh:'示範音節', ko:'어', ro:'eo' },
      { tag:'ㅕ', zh:'示範音節', ko:'여', ro:'yeo' },
      { tag:'ㅗ', zh:'示範音節', ko:'오', ro:'o' },
      { tag:'ㅛ', zh:'示範音節', ko:'요', ro:'yo' },
      { tag:'ㅜ', zh:'示範音節', ko:'우', ro:'u' },
      { tag:'ㅠ', zh:'示範音節', ko:'유', ro:'yu' },
      { tag:'ㅡ', zh:'示範音節', ko:'으', ro:'eu' },
      { tag:'ㅣ', zh:'示範音節', ko:'이', ro:'i' }
    ],
    syllableExamples:[
      { tag:'ㄱ + ㅏ',      zh:'初聲＋中聲',       ko:'가', ro:'ga' },
      { tag:'ㄴ + ㅏ',      zh:'初聲＋中聲',       ko:'나', ro:'na' },
      { tag:'ㅅ + ㅏ',      zh:'初聲＋中聲',       ko:'사', ro:'sa' },
      { tag:'ㅅ + ㅏ + ㅇ', zh:'初聲＋中聲＋終聲', ko:'상', ro:'sang' },
      { tag:'ㅎ + ㅏ + ㄴ', zh:'初聲＋中聲＋終聲', ko:'한', ro:'han' },
      { tag:'ㄱ + ㅜ + ㄱ', zh:'初聲＋中聲＋終聲', ko:'국', ro:'guk' },
      { tag:'ㅁ + ㅏ + ㄴ', zh:'初聲＋中聲＋終聲', ko:'만', ro:'man' }
    ]
  };

  /* ---------- TTS ---------- */

  var ttsSupported = 'speechSynthesis' in window;
  var koreanVoice = null;
  var toastTimer = null;

  function pickKoreanVoice(){
    var voices = speechSynthesis.getVoices();
    koreanVoice = null;
    for (var i = 0; i < voices.length; i++){
      if (voices[i].lang === 'ko-KR'){ koreanVoice = voices[i]; break; }
    }
    if (!koreanVoice){
      for (var j = 0; j < voices.length; j++){
        if (voices[j].lang && voices[j].lang.toLowerCase().indexOf('ko') === 0){
          koreanVoice = voices[j];
          break;
        }
      }
    }
  }

  function showToast(msg){
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toast.classList.remove('is-visible');
    }, 2600);
  }

  function showBanner(msg){
    var banner = document.getElementById('tts-banner');
    banner.hidden = false;
    banner.querySelector('.banner-inner').textContent = msg;
  }

  var speakingCard = null;

  function speak(koreanText, cardEl){
    if (!ttsSupported){
      showToast('此瀏覽器不支援語音播放，請依羅馬拼音自行發音。');
      return;
    }
    speechSynthesis.cancel();
    if (speakingCard) speakingCard.classList.remove('is-speaking');
    speakingCard = cardEl || null;

    var utter = new SpeechSynthesisUtterance(koreanText);
    utter.lang = 'ko-KR';
    if (koreanVoice) utter.voice = koreanVoice;
    utter.rate = 0.9;
    if (cardEl) cardEl.classList.add('is-speaking');
    utter.onend = function(){ if (cardEl) cardEl.classList.remove('is-speaking'); };
    utter.onerror = function(){
      if (cardEl) cardEl.classList.remove('is-speaking');
      showToast('播放失敗，請確認裝置的韓文語音是否已安裝。');
    };
    speechSynthesis.speak(utter);
    if (!koreanVoice){
      showToast('未偵測到韓文語音，嘗試以系統預設語音播放。');
    }
  }

  if (ttsSupported){
    pickKoreanVoice();
    if (typeof speechSynthesis.onvoiceschanged !== 'undefined'){
      speechSynthesis.onvoiceschanged = pickKoreanVoice;
    }
  } else {
    showBanner('此瀏覽器不支援語音播放功能，仍可依羅馬拼音自行發音。建議改用 Chrome、Safari 或 Edge 開啟本頁。');
  }

  /* ---------- Rendering ---------- */

  function renderCard(entry){
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'phrase-card';
    card.setAttribute('aria-label', '播放韓文發音：' + entry.ko + '，' + entry.ro + '，' + entry.zh);

    if (entry.tag){
      var tag = document.createElement('span');
      tag.className = 'phrase-tag';
      tag.textContent = entry.tag;
      card.appendChild(tag);
    }

    var zh = document.createElement('span');
    zh.className = 'phrase-zh';
    zh.textContent = entry.zh;
    card.appendChild(zh);

    var ko = document.createElement('span');
    ko.className = 'phrase-ko';
    ko.lang = 'ko';
    ko.appendChild(document.createTextNode(entry.ko));
    var icon = document.createElement('span');
    icon.className = 'speaker-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '🔊';
    ko.appendChild(icon);
    card.appendChild(ko);

    var ro = document.createElement('span');
    ro.className = 'phrase-ro';
    ro.textContent = entry.ro;
    card.appendChild(ro);

    card.addEventListener('click', function(){ speak(entry.ko, card); });
    return card;
  }

  function renderGrid(container, entries, extraClass){
    var grid = document.createElement('div');
    grid.className = 'phrase-grid' + (extraClass ? ' ' + extraClass : '');
    entries.forEach(function(entry){
      grid.appendChild(renderCard(entry));
    });
    container.appendChild(grid);
  }

  function buildPanels(){
    var panelsRoot = document.getElementById('tab-panels');

    TABS.forEach(function(tab){
      var panel = document.createElement('section');
      panel.className = 'tab-panel';
      panel.id = 'panel-' + tab.id;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', 'tab-' + tab.id);
      panel.dataset.tab = tab.id;

      if (tab.id === 'hangul'){
        var intro = document.createElement('p');
        intro.className = 'panel-intro';
        intro.textContent = '韓文字是把「子音＋母音（＋收尾子音）」拼成一個方塊字。例如 ㄱ＋ㅏ＝가（ga），ㅎ＋ㅏ＋ㄴ＝한（han）。點下面的卡片可以聽發音。';
        panel.appendChild(intro);

        var h1 = document.createElement('h2');
        h1.className = 'subsection-title';
        h1.textContent = '基本子音（14個）';
        panel.appendChild(h1);
        renderGrid(panel, HANGUL.consonants, 'hangul-grid');

        var h2 = document.createElement('h2');
        h2.className = 'subsection-title';
        h2.textContent = '基本母音（10個）';
        panel.appendChild(h2);
        renderGrid(panel, HANGUL.vowels, 'hangul-grid');

        var h3 = document.createElement('h2');
        h3.className = 'subsection-title';
        h3.textContent = '拆字拼音範例';
        panel.appendChild(h3);
        renderGrid(panel, HANGUL.syllableExamples, 'hangul-grid');
      } else {
        renderGrid(panel, PHRASES[tab.id]);
      }

      panelsRoot.appendChild(panel);
    });
  }

  /* ---------- Tabs ---------- */

  var STORAGE_TAB_KEY = 'kt-last-tab';
  var STORAGE_THEME_KEY = 'kt-theme';

  function buildTabBar(){
    var bar = document.getElementById('tab-bar');
    TABS.forEach(function(tab){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab-btn';
      btn.id = 'tab-' + tab.id;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', 'false');
      btn.setAttribute('aria-controls', 'panel-' + tab.id);
      btn.tabIndex = -1;
      btn.dataset.tab = tab.id;
      btn.textContent = tab.label;
      bar.appendChild(btn);
    });
  }

  function initTabs(){
    var btns = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
    var panels = Array.prototype.slice.call(document.querySelectorAll('.tab-panel'));

    function activate(id){
      btns.forEach(function(b){
        var on = b.dataset.tab === id;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-selected', String(on));
        b.tabIndex = on ? 0 : -1;
      });
      panels.forEach(function(p){
        p.classList.toggle('is-active', p.dataset.tab === id);
      });
      try { localStorage.setItem(STORAGE_TAB_KEY, id); } catch (e) {}
    }

    btns.forEach(function(b, i){
      b.addEventListener('click', function(){
        activate(b.dataset.tab);
        b.focus();
      });
      b.addEventListener('keydown', function(e){
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var dir = e.key === 'ArrowRight' ? 1 : -1;
        var next = btns[(i + dir + btns.length) % btns.length];
        next.focus();
        activate(next.dataset.tab);
      });
    });

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_TAB_KEY); } catch (e) {}
    var savedValid = saved && btns.some(function(b){ return b.dataset.tab === saved; });
    activate(savedValid ? saved : btns[0].dataset.tab);
  }

  /* ---------- Theme ---------- */

  function initTheme(){
    var toggle = document.getElementById('theme-toggle');
    var stored = null;
    try { stored = localStorage.getItem(STORAGE_THEME_KEY); } catch (e) {}
    if (stored === 'light' || stored === 'dark'){
      document.documentElement.setAttribute('data-theme', stored);
    }

    toggle.addEventListener('click', function(){
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var current = document.documentElement.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem(STORAGE_THEME_KEY, next); } catch (e) {}
    });
  }

  /* ---------- Init ---------- */

  document.addEventListener('DOMContentLoaded', function(){
    buildTabBar();
    buildPanels();
    initTabs();
    initTheme();
  });
})();
</script>
</body>
</html>
