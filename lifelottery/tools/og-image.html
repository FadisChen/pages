<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>人生籤 share preview (1200x630)</title>
<!-- Template for og-image.png: rendered by tools/build-og-image.mjs. Same night-sky look as the game's dark theme; no external files. -->
<style>
  :root {
    --bg: #0a1024; --ink: #ece7d8; --ink-2: #cfd0dc; --muted: #a0a8c2; --accent: #e8b765; --line: #2b3862; --surface: #131c3a;
    --font-sans: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "WenQuanYi Zen Hei", "Noto Sans CJK TC", sans-serif;
    --font-serif: "Songti TC", "Noto Serif TC", "Source Han Serif TC", "PMingLiU", "Noto Serif CJK TC", "STSong", "WenQuanYi Zen Hei", serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body {
    position: relative; font-family: var(--font-sans); color: var(--ink);
    background:
      radial-gradient(ellipse 80% 70% at 78% 8%, #22357a 0%, transparent 62%),
      radial-gradient(ellipse 70% 50% at 8% 100%, #16224a 0%, transparent 70%),
      linear-gradient(160deg, #0a1024, #0f1a3d 70%, #17265a);
  }
  .stars { position: absolute; inset: 0; }
  .stars i { position: absolute; border-radius: 50%; background: #fff; }
  .frame { position: absolute; inset: 26px; border: 2px solid rgba(232, 183, 101, 0.38); border-radius: 26px; }
  .frame::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(232, 183, 101, 0.16); border-radius: 19px; }
  .text { position: absolute; left: 86px; top: 92px; width: 640px; }
  .eyebrow { font-size: 26px; letter-spacing: 0.42em; color: var(--accent); font-weight: 700; }
  h1 { font-family: var(--font-serif); font-size: 190px; line-height: 1.06; letter-spacing: 0.1em; margin: 14px 0 0 -6px; color: var(--ink); text-shadow: 0 6px 40px rgba(232, 183, 101, 0.22); }
  .tag { margin-top: 18px; font-family: var(--font-serif); font-size: 38px; line-height: 1.6; color: var(--ink-2); letter-spacing: 0.04em; }
  .tag b { color: var(--accent); font-weight: 700; }
  .chips { position: absolute; left: 86px; bottom: 70px; display: flex; gap: 12px; }
  .chip { padding: 8px 18px; border-radius: 999px; border: 1.5px solid rgba(232, 183, 101, 0.55); color: var(--ink); background: rgba(19, 28, 58, 0.78); font-size: 23px; font-weight: 700; letter-spacing: 0.05em; }
  .art { position: absolute; right: 44px; top: 54px; width: 430px; height: 520px; overflow: visible; }
  .glow { position: absolute; right: 20px; top: 20px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(232, 183, 101, 0.26), rgba(232, 183, 101, 0) 68%); }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="frame"></div>
  <div class="text">
    <p class="eyebrow">LIFE LOTTERY</p>
    <h1>人生籤</h1>
    <p class="tag">你無法選擇在哪裡出生。<br>抽一支籤，<b>走完這一趟。</b></p>
  </div>
  <div class="chips"><span class="chip">依真實統計</span><span class="chip">173 個國家與地區</span><span class="chip">一輩子，約 30 分鐘</span></div>
  <div class="glow"></div>
  <svg class="art" viewBox="40 30 440 480" aria-hidden="true">
    <defs>
      <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3c485"/><stop offset="1" stop-color="#c39d55"/></linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8b765" stop-opacity="0.35"/><stop offset="1" stop-color="#e8b765" stop-opacity="0"/></radialGradient>
    </defs>
    <path d="M388 70a58 58 0 1 0 54 88 46 46 0 1 1-54-88z" fill="#e8b765"/>
    <g transform="rotate(-10 196 356)"><rect x="180" y="150" width="32" height="206" rx="9" fill="url(#stick)"/><rect x="180" y="150" width="32" height="40" rx="9" fill="#8b6f3c"/></g>
    <g transform="rotate(12 316 356)"><rect x="300" y="190" width="32" height="166" rx="9" fill="url(#stick)"/><rect x="300" y="190" width="32" height="40" rx="9" fill="#8b6f3c"/></g>
    <g><rect x="240" y="96" width="32" height="260" rx="9" fill="url(#stick)"/><rect x="240" y="96" width="32" height="52" rx="9" fill="#d4533a"/></g>
    <path d="M146 342h220l-16 124a22 22 0 0 1-22 19H184a22 22 0 0 1-22-19z" fill="#f1e6c8"/>
    <path d="M146 342h220" stroke="#d9c89d" stroke-width="12" stroke-linecap="round"/>
    <rect x="222" y="372" width="68" height="78" rx="12" fill="#a63d27"/>
    <path d="M238 396h36M238 414h36M256 396v38" stroke="#fffaf0" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <script>
    // a fixed sprinkle of stars (a small seeded generator, so the picture is the same every time)
    let a = 20260611;
    const rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const host = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('i'), r = 1 + rnd() * 2.2;
      s.style.cssText = `left:${(rnd() * 1200).toFixed(1)}px;top:${(rnd() * 630).toFixed(1)}px;width:${r.toFixed(1)}px;height:${r.toFixed(1)}px;opacity:${(0.25 + rnd() * 0.6).toFixed(2)}${rnd() < 0.1 ? ';background:#e8b765' : ''}`;
      host.append(s);
    }
  </script>
</body>
</html>
