<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>毛豬採購證明單 OCR</title>
  <link rel="preconnect" href="https://docs.opencv.org" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>毛豬採購證明單 OCR</h1>
      <p>手機拍照或選取照片後，系統會先自動偵測文件、校正透視與水平傾斜，再依固定版型辨識欄位；必要時可人工微調四角。OCR 結果會直接填入表單供確認與修正。</p>
    </header>

    <section class="card">
      <h2 class="section-title"><span class="step-badge">1</span>取得文件照片</h2>
      <div class="capture-grid">
        <button id="takePhotoBtn" class="btn btn-primary" type="button">開啟相機拍照</button>
        <button id="choosePhotoBtn" class="btn btn-secondary" type="button">從手機選取照片</button>
      </div>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
      <input id="galleryInput" type="file" accept="image/*" hidden />
      <p class="help">建議讓整張文件完整入鏡、避免反光。系統會先自動偵測文件四角、校正透視與水平傾斜；偵測信心不足時才請使用者手動微調。</p>
      <div id="errorBox" class="error" role="alert"></div>
    </section>

    <section id="previewCard" class="card preview-card">
      <h2 class="section-title"><span class="step-badge">2</span>校正後文件</h2>
      <div class="preview-box"><img id="correctedPreview" alt="校正後文件預覽" /></div>
      <div id="autoCorrectionNote" class="auto-note"><span class="auto-dot"></span><div><strong>校正資訊</strong><br><span id="autoCorrectionText">尚未校正</span></div></div>
      <div class="preview-actions">
        <button id="editAgainBtn" class="btn btn-ghost" type="button">重新調整四角</button>
        <button id="recognizeAgainBtn" class="btn btn-secondary" type="button">重新 OCR</button>
      </div>
    </section>

    <section id="statusCard" class="card status" aria-live="polite">
      <h2 class="section-title"><span class="step-badge">3</span>OCR 辨識</h2>
      <div class="status-row"><span id="statusText">準備中</span><span id="progressText">0%</span></div>
      <div class="track"><div id="progressBar" class="bar"></div></div>
      <div class="status-note">依固定版型分別辨識市場名稱、文件名稱、日期、承銷人與左右兩欄拍賣編號。</div>
    </section>

    <section id="resultCard" class="card result-card">
      <h2 class="section-title"><span class="step-badge">4</span>確認與修正</h2>
      <div id="resultNotice" class="notice"></div>

      <div class="field">
        <label for="marketInput">市場名稱</label>
        <input id="marketInput" autocomplete="off" />
      </div>
      <div class="field">
        <label for="documentInput">文件名稱</label>
        <input id="documentInput" autocomplete="off" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="dateInput">拍賣日期</label>
          <input id="dateInput" inputmode="text" autocomplete="off" />
        </div>
        <div class="field">
          <label for="dealerNumberInput">承銷人編號</label>
          <input id="dealerNumberInput" inputmode="numeric" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label for="dealerNameInput">承銷人姓名</label>
        <input id="dealerNameInput" autocomplete="off" />
      </div>

      <div class="code-head">
        <h3>拍賣編號</h3>
        <span id="codeCount">0 筆</span>
      </div>
      <div id="codeList" class="code-list"></div>
      <button id="addCodeBtn" class="btn btn-ghost" type="button" style="width:100%;margin-top:9px;">＋ 新增拍賣編號</button>

      <div class="result-actions">
        <button id="copyJsonBtn" class="btn btn-secondary" type="button">複製 JSON</button>
        <button id="newScanBtn" class="btn btn-dark" type="button">辨識下一張</button>
      </div>
    </section>
  </main>

  <section id="editor" class="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <div class="editor-head">
      <h2 id="editorTitle">裁切與透視校正</h2>
      <button id="editorCloseBtn" class="editor-close" type="button" aria-label="關閉">×</button>
    </div>
    <div id="editorStage" class="editor-stage">
      <canvas id="editorCanvas"></canvas>
      <div id="editorTip" class="editor-tip">拖曳 4 個圓點到文件四角；可先旋轉再調整</div>
    </div>
    <div class="editor-tools">
      <div class="tool-row">
        <button id="rotateLeftBtn" class="btn btn-ghost" type="button">↶ 左轉 90°</button>
        <button id="autoDetectBtn" class="btn btn-ghost" type="button">自動找四角</button>
        <button id="resetCornersBtn" class="btn btn-ghost" type="button">重設四角</button>
        <button id="rotateRightBtn" class="btn btn-ghost" type="button">↷ 右轉 90°</button>
      </div>
      <button id="applyCorrectionBtn" class="btn btn-primary editor-apply" type="button">套用校正並開始 OCR</button>
    </div>
  </section>

  <div id="processingOverlay" class="processing-overlay" aria-live="polite">
    <div class="processing-box">
      <strong id="processingTitle">正在校正圖片…</strong>
      <div class="track"><div id="processingBar" class="bar"></div></div>
      <div id="processingHint" class="status-note" style="margin-top:10px"></div>
    </div>
  </div>

  <canvas id="sourceCanvas" hidden></canvas>
  <canvas id="correctedCanvas" hidden></canvas>

<script>
(() => {
  'use strict';

  // 固定版型：依目前實際文件寬高比例建立標準化頁面。
  // 將照片透視校正成同一比例後，以下 ROI 才能穩定套用。
  const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
  const OPENCV_URL = 'https://docs.opencv.org/4.x/opencv.js';

  // 由目前固定版型實際樣本估算，頁面約為 3:4。
  // 固定成同一比例後，ROI 座標才能在不同手機照片間保持一致。
  const FORM_ASPECT = 0.75; // width / height
  const NORMALIZED_WIDTH = 1600;
  const NORMALIZED_HEIGHT = Math.round(NORMALIZED_WIDTH / FORM_ASPECT);
  const MAX_SOURCE_SIDE = 2600;
  const DETECT_LONG_SIDE = 1200;
  const AUTO_APPLY_CONFIDENCE = 0.78;
  const AUTO_REVIEW_CONFIDENCE = 0.52;
  const TEMPLATE_FAST_PATH_CONFIDENCE = 0.84;

  // 外部大型引擎一律設 hard timeout，避免手機網路/CDN 異常時 UI 永久卡住。
  const SCRIPT_LOAD_TIMEOUT_MS = 12000;
  const OPENCV_TOTAL_TIMEOUT_MS = 14000;
  const OPENCV_RUNTIME_TIMEOUT_MS = 9000;
  const TESSERACT_WORKER_TIMEOUT_MS = 45000;

  const ROI = {
    market:       { x1: 0.075, y1: 0.022, x2: 0.925, y2: 0.070, psm: 'SINGLE_LINE', type: 'text', pad: 0.003, targetWidth: 1200 },
    document:     { x1: 0.245, y1: 0.067, x2: 0.755, y2: 0.103, psm: 'SINGLE_LINE', type: 'text', pad: 0.003, targetWidth: 900 },
    date:         { x1: 0.165, y1: 0.101, x2: 0.375, y2: 0.122, psm: 'SINGLE_LINE', type: 'date', pad: 0.0015, targetWidth: 800 },
    dealerNumber: { x1: 0.175, y1: 0.123, x2: 0.285, y2: 0.140, psm: 'SINGLE_LINE', type: 'number', pad: 0.001, targetWidth: 520 },
    dealerName:   { x1: 0.170, y1: 0.143, x2: 0.355, y2: 0.161, psm: 'SINGLE_LINE', type: 'name', pad: 0.001, targetWidth: 700 },
    codesLeft:    { x1: 0.285, y1: 0.188, x2: 0.525, y2: 0.715, psm: 'SPARSE_TEXT', type: 'codes', pad: 0.002, targetWidth: 900 },
    codesRight:   { x1: 0.705, y1: 0.188, x2: 0.990, y2: 0.715, psm: 'SPARSE_TEXT', type: 'codes', pad: 0.002, targetWidth: 900 }
  };

  const $ = (id) => document.getElementById(id);
  const takePhotoBtn = $('takePhotoBtn');
  const choosePhotoBtn = $('choosePhotoBtn');
  const cameraInput = $('cameraInput');
  const galleryInput = $('galleryInput');
  const errorBox = $('errorBox');
  const previewCard = $('previewCard');
  const correctedPreview = $('correctedPreview');
  const autoCorrectionNote = $('autoCorrectionNote');
  const autoCorrectionText = $('autoCorrectionText');
  const editAgainBtn = $('editAgainBtn');
  const recognizeAgainBtn = $('recognizeAgainBtn');
  const statusCard = $('statusCard');
  const statusText = $('statusText');
  const progressText = $('progressText');
  const progressBar = $('progressBar');
  const resultCard = $('resultCard');
  const resultNotice = $('resultNotice');
  const marketInput = $('marketInput');
  const documentInput = $('documentInput');
  const dateInput = $('dateInput');
  const dealerNumberInput = $('dealerNumberInput');
  const dealerNameInput = $('dealerNameInput');
  const codeList = $('codeList');
  const codeCount = $('codeCount');
  const addCodeBtn = $('addCodeBtn');
  const copyJsonBtn = $('copyJsonBtn');
  const newScanBtn = $('newScanBtn');

  const editor = $('editor');
  const editorStage = $('editorStage');
  const editorCanvas = $('editorCanvas');
  const editorCloseBtn = $('editorCloseBtn');
  const editorTip = $('editorTip');
  const rotateLeftBtn = $('rotateLeftBtn');
  const autoDetectBtn = $('autoDetectBtn');
  const rotateRightBtn = $('rotateRightBtn');
  const resetCornersBtn = $('resetCornersBtn');
  const applyCorrectionBtn = $('applyCorrectionBtn');
  const sourceCanvas = $('sourceCanvas');
  const correctedCanvas = $('correctedCanvas');
  const processingOverlay = $('processingOverlay');
  const processingTitle = $('processingTitle');
  const processingBar = $('processingBar');
  const processingHint = $('processingHint');

  let sourceCtx = sourceCanvas.getContext('2d', { alpha: false, willReadFrequently: true });
  let correctedCtx = correctedCanvas.getContext('2d', { alpha: false, willReadFrequently: true });
  let editorCtx = editorCanvas.getContext('2d');
  let sourceFile = null;
  let correctedPreviewUrl = null;
  let worker = null;
  let workerPromise = null;
  let tesseractScriptPromise = null;
  let opencvPromise = null;
  let cvApi = null;
  let opencvFailure = null;
  let isBusy = false;
  let activeHandle = -1;
  let drawTransform = { scale: 1, ox: 0, oy: 0, cssW: 0, cssH: 0 };
  let corners = [];
  let progressContext = { base: 0, span: 1, label: '' };
  let autoDetection = { method: 'manual', confidence: 0, deskewAngle: 0, detail: '' };

  const statusMap = {
    'loading tesseract core': '載入 OCR 核心',
    'initializing tesseract': '初始化 OCR',
    'loading language traineddata': '載入繁體中文語言資料',
    'initializing api': '初始化辨識引擎',
    'recognizing text': '辨識中'
  };

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }
  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }
  function setBusy(busy) {
    isBusy = busy;
    takePhotoBtn.disabled = busy;
    choosePhotoBtn.disabled = busy;
    applyCorrectionBtn.disabled = busy;
    recognizeAgainBtn.disabled = busy;
    autoDetectBtn.disabled = busy;
  }
  function setProgress(label, value) {
    const p = Math.max(0, Math.min(1, Number(value) || 0));
    statusCard.classList.add('show');
    statusText.textContent = label;
    progressText.textContent = `${Math.round(p * 100)}%`;
    progressBar.style.width = `${p * 100}%`;
  }
  function workerLogger(m) {
    const local = Math.max(0, Math.min(1, Number(m.progress) || 0));
    const total = progressContext.base + local * progressContext.span;
    const text = statusMap[m.status] || m.status || '處理中';
    setProgress(progressContext.label ? `${progressContext.label}：${text}` : text, total);
  }
  function showProcessing(title, p = 0.1, hint = '') {
    processingTitle.textContent = title;
    processingBar.style.width = `${Math.max(0,Math.min(1,p))*100}%`;
    processingHint.textContent = hint || '';
    processingOverlay.classList.add('show');
  }
  function setProcessingStatus(title, p, hint = '') {
    processingTitle.textContent = title;
    if (Number.isFinite(p)) processingBar.style.width = `${Math.max(0,Math.min(1,p))*100}%`;
    processingHint.textContent = hint || '';
  }
  function hideProcessing() {
    processingOverlay.classList.remove('show');
    processingHint.textContent = '';
  }

  function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

  function withTimeout(promise, timeoutMs, message) {
    let timer = null;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error(message || `處理逾時（${timeoutMs}ms）`)), timeoutMs);
    });
    return Promise.race([Promise.resolve(promise), timeout]).finally(() => {
      if (timer) clearTimeout(timer);
    });
  }

  function loadExternalScript(src, id, timeoutMs = SCRIPT_LOAD_TIMEOUT_MS) {
    const old = document.getElementById(id);
    if (old?.dataset.loaded === '1') return Promise.resolve();
    // 上一次若停在半載入狀態，直接移除，避免永遠等待不存在的 load/error。
    if (old) old.remove();

    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      let settled = false;
      let timer = null;
      const cleanup = () => {
        if (timer) clearTimeout(timer);
        script.onload = null;
        script.onerror = null;
      };
      const succeed = () => {
        if (settled) return;
        settled = true;
        cleanup();
        script.dataset.loaded = '1';
        resolve();
      };
      const fail = (message) => {
        if (settled) return;
        settled = true;
        cleanup();
        script.remove();
        reject(new Error(message));
      };

      script.id = id;
      script.src = src;
      script.async = true;
      script.onload = succeed;
      script.onerror = () => fail(`無法載入 ${src}`);
      timer = setTimeout(() => fail(`載入外部元件逾時：${src}`), timeoutMs);
      document.head.appendChild(script);
    });
  }

  async function ensureTesseract() {
    if (window.Tesseract?.createWorker) return window.Tesseract;
    if (!tesseractScriptPromise) {
      tesseractScriptPromise = loadExternalScript(TESSERACT_URL, 'tesseract-js', SCRIPT_LOAD_TIMEOUT_MS)
        .then(() => {
          if (!window.Tesseract?.createWorker) throw new Error('Tesseract.js 初始化失敗。');
          return window.Tesseract;
        })
        .catch((err) => { tesseractScriptPromise = null; throw err; });
    }
    return tesseractScriptPromise;
  }

  async function waitForOpenCVRuntime() {
    let candidate = window.cv;
    if (candidate && typeof candidate.then === 'function') {
      candidate = await withTimeout(
        candidate,
        OPENCV_RUNTIME_TIMEOUT_MS,
        'OpenCV.js Runtime 初始化逾時。'
      );
      window.cv = candidate;
    }

    const deadline = Date.now() + OPENCV_RUNTIME_TIMEOUT_MS;
    while (Date.now() < deadline) {
      candidate = window.cv;
      if (candidate?.Mat && candidate?.imread && candidate?.findContours) {
        cvApi = candidate;
        return candidate;
      }
      await sleep(80);
    }
    throw new Error('OpenCV.js Runtime 初始化逾時。');
  }

  async function ensureOpenCV({ forceRetry = false } = {}) {
    if (cvApi?.Mat) return cvApi;
    if (forceRetry) {
      opencvFailure = null;
      opencvPromise = null;
      const old = document.getElementById('opencv-js');
      if (old && old.dataset.loaded !== '1') old.remove();
    }
    if (opencvFailure && !forceRetry) throw opencvFailure;
    if (opencvPromise) return opencvPromise;

    const bootstrap = (async () => {
      await loadExternalScript(OPENCV_URL, 'opencv-js', SCRIPT_LOAD_TIMEOUT_MS);
      return waitForOpenCVRuntime();
    })();

    opencvPromise = withTimeout(
      bootstrap,
      OPENCV_TOTAL_TIMEOUT_MS,
      'OpenCV.js 載入或初始化逾時，已改用備援流程。'
    )
      .then((cv) => {
        cvApi = cv;
        opencvFailure = null;
        return cv;
      })
      .catch((err) => {
        opencvFailure = err instanceof Error ? err : new Error(String(err));
        opencvPromise = null;
        throw opencvFailure;
      });

    return opencvPromise;
  }

  function warmOpenCVInBackground() {
    if (cvApi?.Mat || opencvPromise || opencvFailure) return;
    if (navigator.connection?.saveData) return;
    ensureOpenCV().catch((err) => {
      // 預熱失敗不打擾使用者；真正處理照片時會直接 fallback。
      console.warn('OpenCV background warm-up unavailable:', err);
    });
  }

  async function getWorker() {
    if (worker) return worker;
    if (workerPromise) return workerPromise;
    const T = await ensureTesseract();
    progressContext = { base: 0, span: 0.12, label: '' };
    const createPromise = T.createWorker(['chi_tra', 'eng'], T.OEM.LSTM_ONLY, { logger: workerLogger })
      .then(async (w) => {
        await w.setParameters({ preserve_interword_spaces: '1', user_defined_dpi: '300' });
        worker = w;
        return w;
      });

    workerPromise = withTimeout(
      createPromise,
      TESSERACT_WORKER_TIMEOUT_MS,
      'OCR 引擎初始化逾時，請確認網路連線後重試。'
    )
      .catch((err) => { workerPromise = null; throw err; });
    return workerPromise;
  }

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取圖片。')); };
      img.src = url;
    });
  }

  async function loadDrawable(file) {
    if ('createImageBitmap' in window) {
      try {
        return await createImageBitmap(file, { imageOrientation: 'from-image' });
      } catch {}
    }
    return loadImage(file);
  }

  async function setSourceFromFile(file) {
    if (!file || !file.type?.startsWith('image/')) throw new Error('請選擇圖片檔案。');
    sourceFile = file;
    const drawable = await loadDrawable(file);
    const iw = drawable.naturalWidth || drawable.width;
    const ih = drawable.naturalHeight || drawable.height;
    const scale = Math.min(1, MAX_SOURCE_SIDE / Math.max(iw, ih));
    const w = Math.max(1, Math.round(iw * scale));
    const h = Math.max(1, Math.round(ih * scale));
    sourceCanvas.width = w;
    sourceCanvas.height = h;
    sourceCtx = sourceCanvas.getContext('2d', { alpha: false, willReadFrequently: true });
    sourceCtx.fillStyle = '#fff';
    sourceCtx.fillRect(0,0,w,h);
    sourceCtx.imageSmoothingEnabled = true;
    sourceCtx.imageSmoothingQuality = 'high';
    sourceCtx.drawImage(drawable, 0, 0, w, h);
    if (typeof drawable.close === 'function') drawable.close();
    resetCorners();
    autoDetection = { method: 'manual', confidence: 0, deskewAngle: 0, detail: '' };
  }

  function resetCorners() {
    const m = 0.018;
    corners = [
      { x: sourceCanvas.width * m, y: sourceCanvas.height * m },
      { x: sourceCanvas.width * (1-m), y: sourceCanvas.height * m },
      { x: sourceCanvas.width * (1-m), y: sourceCanvas.height * (1-m) },
      { x: sourceCanvas.width * m, y: sourceCanvas.height * (1-m) }
    ];
    renderEditor();
  }


  function clamp01(v) { return Math.max(0, Math.min(1, Number(v) || 0)); }

  function setAutoCorrectionInfo(kind, text) {
    autoCorrectionNote.className = `auto-note ${kind || ''}`.trim();
    autoCorrectionText.textContent = text || '';
  }

  function polygonArea(pts) {
    let sum = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      sum += a.x * b.y - b.x * a.y;
    }
    return Math.abs(sum) / 2;
  }

  function orderQuad(points) {
    const pts = points.map((p) => ({ x: Number(p.x), y: Number(p.y) }));
    if (pts.length !== 4) return pts;
    const sums = pts.map((p) => p.x + p.y);
    const diffs = pts.map((p) => p.y - p.x);
    const pick = (arr, fn) => arr.reduce((best, v, i) => fn(v, arr[best]) ? i : best, 0);
    const tl = pts[pick(sums, (a, b) => a < b)];
    const br = pts[pick(sums, (a, b) => a > b)];
    const tr = pts[pick(diffs, (a, b) => a < b)];
    const bl = pts[pick(diffs, (a, b) => a > b)];
    const ordered = [tl, tr, br, bl];
    if (new Set(ordered.map((p) => `${p.x},${p.y}`)).size === 4) return ordered;

    const byY = pts.slice().sort((a, b) => a.y - b.y);
    const top = byY.slice(0, 2).sort((a, b) => a.x - b.x);
    const bottom = byY.slice(2).sort((a, b) => a.x - b.x);
    return [top[0], top[1], bottom[1], bottom[0]];
  }

  function quadMetrics(pts) {
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const top = d(pts[0], pts[1]);
    const right = d(pts[1], pts[2]);
    const bottom = d(pts[2], pts[3]);
    const left = d(pts[3], pts[0]);
    const width = (top + bottom) / 2;
    const height = (left + right) / 2;
    return { width, height, aspect: Math.min(width, height) / Math.max(width, height) };
  }

  function strongestDarkRow(canvas, y1Ratio, y2Ratio) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const y1 = Math.max(0, Math.floor(canvas.height * y1Ratio));
    const y2 = Math.min(canvas.height - 1, Math.ceil(canvas.height * y2Ratio));
    const stepX = Math.max(1, Math.floor(canvas.width / 900));
    let best = { strength: 0, y: y1 };
    for (let y = y1; y <= y2; y += 2) {
      const row = ctx.getImageData(0, y, canvas.width, 1).data;
      let dark = 0, total = 0;
      for (let x = 0; x < canvas.width; x += stepX) {
        const i = x * 4;
        const g = 0.299 * row[i] + 0.587 * row[i + 1] + 0.114 * row[i + 2];
        if (g < 105) dark++;
        total++;
      }
      const strength = total ? dark / total : 0;
      if (strength > best.strength) best = { strength, y };
    }
    return best;
  }

  function detectTightTemplateFrame() {
    const w = sourceCanvas.width, h = sourceCanvas.height;
    if (!w || !h || h <= w) return null;
    const aspect = w / h;
    const aspectScore = clamp01(1 - Math.abs(aspect - FORM_ASPECT) / 0.11);
    const topLine = strongestDarkRow(sourceCanvas, 0.135, 0.205);
    const bottomLine = strongestDarkRow(sourceCanvas, 0.62, 0.76);

    // 固定版型若幾乎填滿畫面，表格上方的長水平線通常會橫跨約 80% 以上畫面。
    // 這個 fallback 專門處理「紙張邊界已被照片裁掉」的情況。
    if (aspectScore < 0.45 || topLine.strength < 0.62) return null;
    const lineScore = clamp01((topLine.strength - 0.55) / 0.38);
    const bottomScore = clamp01(bottomLine.strength / 0.42);
    const confidence = clamp01(0.52 + 0.22 * aspectScore + 0.18 * lineScore + 0.08 * bottomScore);
    return {
      method: 'template-frame',
      confidence,
      quarterTurn: false,
      corners: [
        { x: 0, y: 0 },
        { x: w - 1, y: 0 },
        { x: w - 1, y: h - 1 },
        { x: 0, y: h - 1 }
      ],
      detail: `固定版型填滿畫面；上方表格線強度 ${Math.round(topLine.strength * 100)}%`
    };
  }

  function detectDocumentWithOpenCV(cv) {
    let src, small, gray, blurred, edges, closed, contours, hierarchy, kernel;
    try {
      src = cv.imread(sourceCanvas);
      const scale = Math.min(1, DETECT_LONG_SIDE / Math.max(src.cols, src.rows));
      small = new cv.Mat();
      cv.resize(src, small, new cv.Size(Math.max(1, Math.round(src.cols * scale)), Math.max(1, Math.round(src.rows * scale))), 0, 0, cv.INTER_AREA);
      gray = new cv.Mat();
      blurred = new cv.Mat();
      edges = new cv.Mat();
      closed = new cv.Mat();
      cv.cvtColor(small, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
      cv.Canny(blurred, edges, 45, 150);
      kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
      cv.morphologyEx(edges, closed, cv.MORPH_CLOSE, kernel, new cv.Point(-1, -1), 2);
      contours = new cv.MatVector();
      hierarchy = new cv.Mat();
      cv.findContours(closed, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

      const imageArea = small.cols * small.rows;
      let best = null;
      const epsilons = [0.015, 0.02, 0.025, 0.03, 0.04];
      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        try {
          const contourArea = Math.abs(cv.contourArea(cnt, false));
          const areaRatio = contourArea / imageArea;
          if (areaRatio < 0.18) continue;
          const perimeter = cv.arcLength(cnt, true);
          for (const eps of epsilons) {
            const approx = new cv.Mat();
            try {
              cv.approxPolyDP(cnt, approx, eps * perimeter, true);
              if (approx.rows !== 4 || (cv.isContourConvex && !cv.isContourConvex(approx))) continue;
              const data = approx.data32S;
              const raw = [];
              for (let j = 0; j < 4; j++) raw.push({ x: data[j * 2], y: data[j * 2 + 1] });
              let ordered = orderQuad(raw);
              const metrics = quadMetrics(ordered);
              const aspectScore = clamp01(1 - Math.abs(metrics.aspect - FORM_ASPECT) / 0.30);
              const areaScore = clamp01((areaRatio - 0.18) / 0.62);
              const cx = ordered.reduce((sum, p) => sum + p.x, 0) / 4;
              const cy = ordered.reduce((sum, p) => sum + p.y, 0) / 4;
              const centerDist = Math.hypot(cx - small.cols / 2, cy - small.rows / 2) / Math.hypot(small.cols / 2, small.rows / 2);
              const centerScore = clamp01(1 - centerDist);
              let confidence = clamp01(0.56 * areaScore + 0.30 * aspectScore + 0.14 * centerScore);
              let quarterTurn = false;
              if (metrics.width > metrics.height) {
                // 讓輸出保持直式。方向可能仍差 180 度，因此降低信心並要求人工確認。
                ordered = [ordered[1], ordered[2], ordered[3], ordered[0]];
                quarterTurn = true;
                confidence = Math.min(confidence, 0.68);
              }
              if (!best || confidence > best.confidence) {
                best = {
                  method: 'contour', confidence, quarterTurn,
                  corners: ordered.map((p) => ({ x: p.x / scale, y: p.y / scale })),
                  detail: `文件輪廓覆蓋 ${Math.round(areaRatio * 100)}%，比例相似度 ${Math.round(aspectScore * 100)}%`
                };
              }
              break;
            } finally {
              approx.delete();
            }
          }
        } finally {
          cnt.delete();
        }
      }
      return best;
    } finally {
      [src, small, gray, blurred, edges, closed, contours, hierarchy, kernel].forEach((m) => {
        try { if (m && typeof m.delete === 'function') m.delete(); } catch {}
      });
    }
  }

  async function autoDetectDocument({ keepEditorOpen = false, forceOpenCVRetry = false } = {}) {
    // 先跑零下載成本的固定版型快速判斷。大量實際照片本來就幾乎填滿畫面，
    // 這條 fast path 可直接避開 OpenCV.js 首次載入成本。
    const templateCandidate = detectTightTemplateFrame();
    if (!forceOpenCVRetry && templateCandidate && templateCandidate.confidence >= TEMPLATE_FAST_PATH_CONFIDENCE) {
      corners = templateCandidate.corners.map((p) => ({
        x: Math.max(0, Math.min(sourceCanvas.width - 1, p.x)),
        y: Math.max(0, Math.min(sourceCanvas.height - 1, p.y))
      }));
      autoDetection = { ...templateCandidate, deskewAngle: 0 };
      const pct = Math.round(templateCandidate.confidence * 100);
      editorTip.textContent = `固定版型已快速定位（信心 ${pct}%）；若邊界不準可再手動調整`;
      if (keepEditorOpen) renderEditor();
      return templateCandidate;
    }

    let cvCandidate = null;
    let cvError = null;
    try {
      setProcessingStatus(
        '正在載入文件偵測引擎…',
        0.30,
        `首次使用需下載 OpenCV.js；最長等待約 ${Math.round(OPENCV_TOTAL_TIMEOUT_MS / 1000)} 秒，逾時會自動切換備援流程。`
      );
      const cv = await ensureOpenCV({ forceRetry: forceOpenCVRetry });
      setProcessingStatus('正在分析文件邊界…', 0.33, '已載入 OpenCV.js，正在搜尋紙張輪廓。');
      cvCandidate = detectDocumentWithOpenCV(cv);
    } catch (err) {
      cvError = err;
      console.warn('OpenCV auto detection unavailable:', err);
    }

    let candidate = cvCandidate;
    if (!candidate || (templateCandidate && templateCandidate.confidence > candidate.confidence + 0.08)) {
      candidate = templateCandidate;
    }

    if (candidate) {
      corners = candidate.corners.map((p) => ({
        x: Math.max(0, Math.min(sourceCanvas.width - 1, p.x)),
        y: Math.max(0, Math.min(sourceCanvas.height - 1, p.y))
      }));
      autoDetection = { ...candidate, deskewAngle: 0 };
      const pct = Math.round(candidate.confidence * 100);
      editorTip.textContent = candidate.quarterTurn
        ? `已偵測文件（${pct}%），且判斷為橫向；請確認方向與四角`
        : `已預先偵測文件四角（信心 ${pct}%）；不準時可直接拖曳微調`;
      if (keepEditorOpen) renderEditor();
      return candidate;
    }

    resetCorners();
    autoDetection = {
      method: 'manual', confidence: 0, deskewAngle: 0,
      detail: cvError
        ? `自動偵測不可用（${cvError.message || cvError}），已切換人工四角校正。`
        : '未找到可靠文件邊界，已切換人工四角校正。'
    };
    editorTip.textContent = cvError
      ? '自動偵測逾時或不可用，已切換人工模式；請拖曳 4 個圓點到文件四角'
      : '未可靠偵測到文件四角，請拖曳 4 個圓點到文件四角';
    if (keepEditorOpen) renderEditor();
    return null;
  }

  function openEditor() {
    editor.classList.add('show');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(renderEditor);
  }
  function closeEditor() {
    editor.classList.remove('show');
    document.body.style.overflow = '';
    activeHandle = -1;
  }

  function renderEditor() {
    if (!editor.classList.contains('show') || !sourceCanvas.width) return;
    const rect = editorStage.getBoundingClientRect();
    const cssW = Math.max(1, Math.round(rect.width));
    const cssH = Math.max(1, Math.round(rect.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    editorCanvas.width = Math.round(cssW * dpr);
    editorCanvas.height = Math.round(cssH * dpr);
    editorCanvas.style.width = `${cssW}px`;
    editorCanvas.style.height = `${cssH}px`;
    editorCtx = editorCanvas.getContext('2d');
    editorCtx.setTransform(dpr,0,0,dpr,0,0);
    editorCtx.clearRect(0,0,cssW,cssH);

    const scale = Math.min(cssW / sourceCanvas.width, cssH / sourceCanvas.height);
    const dw = sourceCanvas.width * scale;
    const dh = sourceCanvas.height * scale;
    const ox = (cssW - dw) / 2;
    const oy = (cssH - dh) / 2;
    drawTransform = { scale, ox, oy, cssW, cssH };

    editorCtx.fillStyle = '#05070b';
    editorCtx.fillRect(0,0,cssW,cssH);
    editorCtx.drawImage(sourceCanvas, ox, oy, dw, dh);

    // Shade outside selected quadrilateral.
    const pts = corners.map(toDisplayPoint);
    editorCtx.save();
    editorCtx.fillStyle = 'rgba(0,0,0,.45)';
    editorCtx.beginPath();
    editorCtx.rect(0,0,cssW,cssH);
    editorCtx.moveTo(pts[0].x,pts[0].y);
    for (let i=1;i<pts.length;i++) editorCtx.lineTo(pts[i].x,pts[i].y);
    editorCtx.closePath();
    editorCtx.fill('evenodd');
    editorCtx.restore();

    editorCtx.lineWidth = 3;
    editorCtx.strokeStyle = '#60a5fa';
    editorCtx.beginPath();
    editorCtx.moveTo(pts[0].x,pts[0].y);
    for (let i=1;i<pts.length;i++) editorCtx.lineTo(pts[i].x,pts[i].y);
    editorCtx.closePath();
    editorCtx.stroke();

    pts.forEach((p,i) => {
      editorCtx.beginPath();
      editorCtx.arc(p.x,p.y,13,0,Math.PI*2);
      editorCtx.fillStyle = '#fff';
      editorCtx.fill();
      editorCtx.lineWidth = 4;
      editorCtx.strokeStyle = i === activeHandle ? '#f59e0b' : '#2563eb';
      editorCtx.stroke();
    });
  }

  function toDisplayPoint(p) {
    return { x: drawTransform.ox + p.x * drawTransform.scale, y: drawTransform.oy + p.y * drawTransform.scale };
  }
  function toSourcePoint(x,y) {
    return {
      x: Math.max(0, Math.min(sourceCanvas.width-1, (x - drawTransform.ox) / drawTransform.scale)),
      y: Math.max(0, Math.min(sourceCanvas.height-1, (y - drawTransform.oy) / drawTransform.scale))
    };
  }
  function pointerPos(ev) {
    const r = editorCanvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function nearestHandle(x,y) {
    let idx=-1, best=Infinity;
    corners.forEach((p,i) => {
      const d = toDisplayPoint(p);
      const dist = Math.hypot(d.x-x,d.y-y);
      if (dist < best) { best=dist; idx=i; }
    });
    return best <= 46 ? idx : -1;
  }

  editorCanvas.addEventListener('pointerdown', (ev) => {
    const p = pointerPos(ev);
    activeHandle = nearestHandle(p.x,p.y);
    if (activeHandle >= 0) {
      editorCanvas.setPointerCapture(ev.pointerId);
      ev.preventDefault();
      renderEditor();
    }
  });
  editorCanvas.addEventListener('pointermove', (ev) => {
    if (activeHandle < 0) return;
    const p = pointerPos(ev);
    corners[activeHandle] = toSourcePoint(p.x,p.y);
    ev.preventDefault();
    renderEditor();
  });
  const releaseHandle = (ev) => {
    if (activeHandle >= 0) {
      try { editorCanvas.releasePointerCapture(ev.pointerId); } catch {}
      activeHandle = -1;
      renderEditor();
    }
  };
  editorCanvas.addEventListener('pointerup', releaseHandle);
  editorCanvas.addEventListener('pointercancel', releaseHandle);
  window.addEventListener('resize', () => requestAnimationFrame(renderEditor));

  function rotateSource(clockwise) {
    const temp = document.createElement('canvas');
    temp.width = sourceCanvas.height;
    temp.height = sourceCanvas.width;
    const tctx = temp.getContext('2d', { alpha:false });
    tctx.fillStyle='#fff'; tctx.fillRect(0,0,temp.width,temp.height);
    tctx.translate(temp.width/2,temp.height/2);
    tctx.rotate(clockwise ? Math.PI/2 : -Math.PI/2);
    tctx.drawImage(sourceCanvas,-sourceCanvas.width/2,-sourceCanvas.height/2);
    sourceCanvas.width=temp.width; sourceCanvas.height=temp.height;
    sourceCtx=sourceCanvas.getContext('2d',{alpha:false,willReadFrequently:true});
    sourceCtx.drawImage(temp,0,0);
    resetCorners();
    autoDetection = { method: 'manual', confidence: 0, deskewAngle: 0, detail: '使用者已旋轉圖片。' };
    editorTip.textContent = '已旋轉圖片；可按「自動找四角」重新偵測，或直接拖曳四角';
  }

  function validateCorners(pts) {
    if (pts.length !== 4) return false;
    // Shoelace area check to reject tiny/crossed quadrilaterals.
    let area = 0;
    for (let i=0;i<4;i++) {
      const a=pts[i], b=pts[(i+1)%4];
      area += a.x*b.y - b.x*a.y;
    }
    return Math.abs(area)/2 > sourceCanvas.width*sourceCanvas.height*0.08;
  }

  function solveLinearSystem(A, b) {
    const n = b.length;
    const M = A.map((row,i) => [...row,b[i]]);
    for (let col=0; col<n; col++) {
      let pivot=col;
      for (let r=col+1;r<n;r++) if (Math.abs(M[r][col])>Math.abs(M[pivot][col])) pivot=r;
      if (Math.abs(M[pivot][col]) < 1e-10) throw new Error('文件四角位置無效，請重新調整。');
      [M[col],M[pivot]]=[M[pivot],M[col]];
      const div=M[col][col];
      for (let c=col;c<=n;c++) M[col][c]/=div;
      for (let r=0;r<n;r++) {
        if (r===col) continue;
        const f=M[r][col];
        if (!f) continue;
        for (let c=col;c<=n;c++) M[r][c]-=f*M[col][c];
      }
    }
    return M.map(row=>row[n]);
  }

  // 求「標準化輸出座標 -> 原圖座標」的 3x3 Homography，之後做 inverse mapping。
  function computeHomography(dstPts, srcPts) {
    const A=[], b=[];
    for (let i=0;i<4;i++) {
      const x=dstPts[i].x, y=dstPts[i].y, u=srcPts[i].x, v=srcPts[i].y;
      A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
      A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v);
    }
    const h=solveLinearSystem(A,b);
    return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
  }

  function warpPerspectiveJS(source, pts, outW, outH) {
    if (!validateCorners(pts)) throw new Error('四角範圍太小或交叉，請把四個圓點依左上、右上、右下、左下放到文件四角。');
    const dstPts=[
      {x:0,y:0},{x:outW-1,y:0},{x:outW-1,y:outH-1},{x:0,y:outH-1}
    ];
    const H=computeHomography(dstPts,pts);
    const sctx=source.getContext('2d',{willReadFrequently:true});
    const src=sctx.getImageData(0,0,source.width,source.height);
    const out=new ImageData(outW,outH);
    const sd=src.data, dd=out.data, sw=source.width, sh=source.height;

    for (let y=0;y<outH;y++) {
      // Incremental numerator/denominator terms reduce per-pixel arithmetic.
      let nu=H[1]*y+H[2], nv=H[4]*y+H[5], de=H[7]*y+1;
      for (let x=0;x<outW;x++) {
        const sx=nu/de, sy=nv/de;
        const di=(y*outW+x)*4;
        if (sx>=0 && sy>=0 && sx<sw-1 && sy<sh-1) {
          const x0=sx|0, y0=sy|0, fx=sx-x0, fy=sy-y0;
          const i00=(y0*sw+x0)*4, i10=i00+4, i01=i00+sw*4, i11=i01+4;
          const w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
          dd[di]   = sd[i00]*w00 + sd[i10]*w10 + sd[i01]*w01 + sd[i11]*w11;
          dd[di+1] = sd[i00+1]*w00 + sd[i10+1]*w10 + sd[i01+1]*w01 + sd[i11+1]*w11;
          dd[di+2] = sd[i00+2]*w00 + sd[i10+2]*w10 + sd[i01+2]*w01 + sd[i11+2]*w11;
          dd[di+3] = 255;
        } else {
          dd[di]=dd[di+1]=dd[di+2]=255; dd[di+3]=255;
        }
        nu+=H[0]; nv+=H[3]; de+=H[6];
      }
    }
    const outCanvas=document.createElement('canvas');
    outCanvas.width=outW; outCanvas.height=outH;
    outCanvas.getContext('2d',{alpha:false}).putImageData(out,0,0);
    return outCanvas;
  }


  function isNearFullFrameQuad(pts) {
    if (!pts || pts.length !== 4 || !sourceCanvas.width || !sourceCanvas.height) return false;
    const targets = [
      { x: 0, y: 0 },
      { x: sourceCanvas.width - 1, y: 0 },
      { x: sourceCanvas.width - 1, y: sourceCanvas.height - 1 },
      { x: 0, y: sourceCanvas.height - 1 }
    ];
    const tolerance = Math.hypot(sourceCanvas.width, sourceCanvas.height) * 0.035;
    return pts.every((p, i) => Math.hypot(p.x - targets[i].x, p.y - targets[i].y) <= tolerance);
  }

  function resizeCanvasFast(source, outW, outH) {
    const out = document.createElement('canvas');
    out.width = outW;
    out.height = outH;
    const ctx = out.getContext('2d', { alpha: false });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, outW, outH);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(source, 0, 0, outW, outH);
    return out;
  }

  function warpPerspectiveOpenCV(cv, source, pts, outW, outH) {
    if (!validateCorners(pts)) throw new Error('四角範圍太小或交叉，請重新調整文件四角。');
    const srcMat = cv.imread(source);
    const dstMat = new cv.Mat();
    const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
      pts[0].x, pts[0].y,
      pts[1].x, pts[1].y,
      pts[2].x, pts[2].y,
      pts[3].x, pts[3].y
    ]);
    const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
      0, 0,
      outW - 1, 0,
      outW - 1, outH - 1,
      0, outH - 1
    ]);
    const transform = cv.getPerspectiveTransform(srcPts, dstPts);
    const out = document.createElement('canvas');
    out.width = outW;
    out.height = outH;
    try {
      cv.warpPerspective(
        srcMat,
        dstMat,
        transform,
        new cv.Size(outW, outH),
        cv.INTER_LINEAR,
        cv.BORDER_CONSTANT,
        new cv.Scalar(255, 255, 255, 255)
      );
      cv.imshow(out, dstMat);
      return out;
    } finally {
      srcMat.delete();
      dstMat.delete();
      srcPts.delete();
      dstPts.delete();
      transform.delete();
    }
  }

  function estimateHorizontalSkew(cv, canvas) {
    let src, gray, binary, horizontal, lines, kernel;
    try {
      src = cv.imread(canvas);
      gray = new cv.Mat();
      binary = new cv.Mat();
      horizontal = new cv.Mat();
      lines = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.threshold(gray, binary, 150, 255, cv.THRESH_BINARY_INV);
      const kernelWidth = Math.max(25, Math.round(canvas.width * 0.035));
      kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(kernelWidth, 1));
      cv.morphologyEx(binary, horizontal, cv.MORPH_OPEN, kernel);
      cv.HoughLinesP(
        horizontal,
        lines,
        1,
        Math.PI / 1800,
        45,
        Math.round(canvas.width * 0.42),
        Math.round(canvas.width * 0.06)
      );
      const angles = [];
      const data = lines.data32S || [];
      for (let i = 0; i + 3 < data.length; i += 4) {
        const x1 = data[i], y1 = data[i + 1], x2 = data[i + 2], y2 = data[i + 3];
        const ym = (y1 + y2) / 2;
        if (ym < canvas.height * 0.12 || ym > canvas.height * 0.31) continue;
        const length = Math.hypot(x2 - x1, y2 - y1);
        if (length < canvas.width * 0.42) continue;
        const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        if (Math.abs(angle) <= 5) angles.push(angle);
      }
      if (!angles.length) return 0;
      angles.sort((a, b) => a - b);
      const mid = Math.floor(angles.length / 2);
      return angles.length % 2 ? angles[mid] : (angles[mid - 1] + angles[mid]) / 2;
    } catch (err) {
      console.warn('Deskew estimation failed:', err);
      return 0;
    } finally {
      [src, gray, binary, horizontal, lines, kernel].forEach((m) => {
        try { if (m && typeof m.delete === 'function') m.delete(); } catch {}
      });
    }
  }

  function rotateCanvasOpenCV(cv, canvas, angleDeg) {
    if (Math.abs(angleDeg) < 0.08) return canvas;
    let src, dst, matrix;
    try {
      src = cv.imread(canvas);
      dst = new cv.Mat();
      matrix = cv.getRotationMatrix2D(new cv.Point(src.cols / 2, src.rows / 2), angleDeg, 1);
      cv.warpAffine(
        src,
        dst,
        matrix,
        new cv.Size(src.cols, src.rows),
        cv.INTER_LINEAR,
        cv.BORDER_CONSTANT,
        new cv.Scalar(255, 255, 255, 255)
      );
      const out = document.createElement('canvas');
      out.width = canvas.width;
      out.height = canvas.height;
      cv.imshow(out, dst);
      return out;
    } finally {
      [src, dst, matrix].forEach((m) => {
        try { if (m && typeof m.delete === 'function') m.delete(); } catch {}
      });
    }
  }

  function cropRatio(source,r,padding=r.pad ?? 0.003) {
    const x1=Math.max(0,r.x1-padding), y1=Math.max(0,r.y1-padding);
    const x2=Math.min(1,r.x2+padding), y2=Math.min(1,r.y2+padding);
    const sx=Math.floor(source.width*x1), sy=Math.floor(source.height*y1);
    const sw=Math.max(1,Math.ceil(source.width*x2)-sx), sh=Math.max(1,Math.ceil(source.height*y2)-sy);
    const targetWidth = r.targetWidth || 900;
    const scale = Math.min(3, Math.max(1, targetWidth / sw));
    const c=document.createElement('canvas');
    c.width=Math.round(sw*scale); c.height=Math.round(sh*scale);
    const ctx=c.getContext('2d',{alpha:false,willReadFrequently:true});
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(source,sx,sy,sw,sh,0,0,c.width,c.height);
    return c;
  }

  function otsuThreshold(grayHist,total) {
    let sum=0; for(let i=0;i<256;i++) sum+=i*grayHist[i];
    let sumB=0,wB=0,maxVar=-1,threshold=160;
    for(let t=0;t<256;t++) {
      wB+=grayHist[t]; if(!wB) continue;
      const wF=total-wB; if(!wF) break;
      sumB+=t*grayHist[t];
      const mB=sumB/wB, mF=(sum-sumB)/wF;
      const between=wB*wF*(mB-mF)*(mB-mF);
      if(between>maxVar){ maxVar=between; threshold=t; }
    }
    return threshold;
  }

  function preprocessForOCR(canvas, binary=true) {
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);
    const d=img.data, hist=new Uint32Array(256);
    for(let i=0;i<d.length;i+=4) {
      const g=Math.max(0,Math.min(255,Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])));
      hist[g]++;
      d[i]=d[i+1]=d[i+2]=g;
    }
    if(binary) {
      const t=Math.max(105,Math.min(220,otsuThreshold(hist,canvas.width*canvas.height)));
      for(let i=0;i<d.length;i+=4) {
        const v=d[i] > t ? 255 : 0;
        d[i]=d[i+1]=d[i+2]=v;
      }
    } else {
      // Mild contrast stretch for Chinese strokes.
      for(let i=0;i<d.length;i+=4) {
        const v=Math.max(0,Math.min(255,(d[i]-128)*1.25+128));
        d[i]=d[i+1]=d[i+2]=v;
      }
    }
    ctx.putImageData(img,0,0);
    return canvas;
  }

  function psmValue(name) {
    const PSM = window.Tesseract?.PSM;
    return PSM?.[name] ?? PSM?.SINGLE_BLOCK ?? '6';
  }

  async function recognizeTile(w, key, region, idx, total) {
    let tile=cropRatio(correctedCanvas,region);
    // 對固定表單的淺灰拍照背景，以 ROI 各自 Otsu 二值化，避免整頁陰影影響閾值。
    preprocessForOCR(tile,true);
    const whitelist = region.type==='number' ? '0123456789' :
      region.type==='codes' ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-' : '';
    await w.setParameters({
      tessedit_pageseg_mode: psmValue(region.psm),
      tessedit_char_whitelist: whitelist,
      preserve_interword_spaces:'1',
      user_defined_dpi:'300'
    });
    progressContext={ base:0.12+0.84*(idx/total), span:0.84/total, label:region.type==='codes'?'拍賣編號':key };
    let result=await w.recognize(tile);
    let best={ text:result.data.text||'', confidence:Number(result.data.confidence)||0 };

    // 中文姓名若第一輪低信心，再用灰階高對比重跑一次，避免二值化吃掉細筆畫。
    if (region.type==='name' && (best.confidence<62 || !extractName(best.text))) {
      tile=cropRatio(correctedCanvas,{...region,pad:Math.max(region.pad||0,0.004)});
      preprocessForOCR(tile,false);
      result=await w.recognize(tile);
      const alt={text:result.data.text||'',confidence:Number(result.data.confidence)||0};
      if (extractName(alt.text) && (!extractName(best.text) || alt.confidence>=best.confidence-8)) best=alt;
    }
    tile.width=1; tile.height=1;
    return best;
  }

  function cleanText(s) {
    return String(s||'').replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/^[\s|:：;；,.，。_-]+|[\s|:：;；,.，。_-]+$/g,'').trim();
  }
  function cleanChineseLine(s) {
    return cleanText(s).replace(/\s+/g,'').replace(/^[^\p{Script=Han}A-Za-z0-9（(]+/u,'').replace(/[^\p{Script=Han}A-Za-z0-9）)]+$/u,'');
  }
  function extractMarket(raw) {
    const lines=String(raw||'').split(/\n+/).map(cleanChineseLine).filter(Boolean);
    const c=lines.find(x=>/市場/u.test(x)) || lines.sort((a,b)=>b.length-a.length)[0] || '';
    return c.replace(/毛豬採購證明單.*$/u,'');
  }
  function extractDocument(raw) {
    const s=String(raw||'').replace(/\s+/g,'');
    const m=s.match(/(?:毛豬)?採購證明單[（(]?[^）)\n]{0,6}[）)]?/u);
    return m ? m[0] : cleanChineseLine(s);
  }
  function normalizeDigitChars(s) {
    return String(s||'').replace(/[ＯOQD]/gi,'0').replace(/[ＩIlL|]/g,'1').replace(/[ＳS]/g,'5').replace(/[ＺZ]/g,'2').replace(/[ＢB]/g,'8');
  }
  function extractDate(raw) {
    const s=normalizeDigitChars(String(raw||'')).replace(/\s+/g,' ');
    const m=s.match(/(\d{2,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/u) || s.match(/(\d{2,3})\D+(\d{1,2})\D+(\d{1,2})/);
    return m ? `${Number(m[1])} 年 ${Number(m[2])} 月 ${Number(m[3])} 日` : '';
  }
  function extractNumber(raw) {
    const m=normalizeDigitChars(raw).match(/\d{1,5}/);
    return m ? m[0] : '';
  }
  function extractName(raw) {
    const s=String(raw||'').replace(/\s+/g,'');
    const candidates=s.match(/[\p{Script=Han}]{2,5}/gu)||[];
    return candidates.find(x=>!/(承銷|號碼|編號|日期|拍賣|市場|證明|豬單|項數|頭數)/u.test(x)) || '';
  }
  function normalizeAuctionCode(raw) {
    const s=normalizeDigitChars(String(raw||'').toUpperCase()).replace(/[‐‑‒–—―－_.:：\s]/g,'');
    const m=s.match(/A[CG]([0-9]{2})([0-9]{3,5})/);
    if(!m) return '';
    let serial=m[2];
    if(serial.length<4) serial=serial.padStart(4,'0');
    if(serial.length>4) serial=serial.slice(-4);
    return `AC${m[1]}-${serial}`;
  }
  function extractCodes(raw) {
    const text=String(raw||'').toUpperCase().replace(/[‐‑‒–—―－_]/g,'-');
    const tokens=text.split(/[\s,，;；]+/).filter(Boolean);
    const out=[];
    for(const t of tokens) {
      const c=normalizeAuctionCode(t);
      if(c&&!out.includes(c)) out.push(c);
    }
    // Fallback：允許 OCR 將空格/換行插入代碼。
    const compact=normalizeDigitChars(text).replace(/[^A-Z0-9]/g,'');
    const re=/A[CG][0-9]{2}[0-9]{4}/g;
    for(const m of compact.match(re)||[]) {
      const c=normalizeAuctionCode(m);
      if(c&&!out.includes(c)) out.push(c);
    }
    return out;
  }

  async function runOCR() {
    if (!correctedCanvas.width || isBusy) return;
    clearError(); setBusy(true); statusCard.classList.add('show');
    resultCard.classList.remove('show');
    setProgress('準備 OCR 引擎',0.02);
    try {
      const w=await getWorker();
      const entries=Object.entries(ROI);
      const raws={};
      for(let i=0;i<entries.length;i++) {
        const [key,region]=entries[i];
        raws[key]=await recognizeTile(w,key,region,i,entries.length);
      }
      setProgress('整理表單欄位',0.97);
      const left=extractCodes(raws.codesLeft.text);
      const right=extractCodes(raws.codesRight.text);
      const codes=[...left,...right.filter(c=>!left.includes(c))].sort((a,b)=>{
        const ba=Number(a.slice(2,4)),bb=Number(b.slice(2,4));
        return ba===bb ? Number(a.slice(-4))-Number(b.slice(-4)) : ba-bb;
      });
      const data={
        market:extractMarket(raws.market.text),
        document:extractDocument(raws.document.text),
        date:extractDate(raws.date.text),
        dealerNumber:extractNumber(raws.dealerNumber.text),
        dealerName:extractName(raws.dealerName.text),
        codes
      };
      fillForm(data);
      setProgress('辨識完成',1);
      resultCard.classList.add('show');
      resultCard.scrollIntoView({behavior:'smooth',block:'start'});
    } catch(err) {
      console.error(err);
      showError(`OCR 處理失敗：${err?.message||err}`);
    } finally {
      setBusy(false);
    }
  }

  function fillForm(data) {
    marketInput.value=data.market||'';
    documentInput.value=data.document||'';
    dateInput.value=data.date||'';
    dealerNumberInput.value=data.dealerNumber||'';
    dealerNameInput.value=data.dealerName||'';
    renderCodes(data.codes||[]);
    const required=[marketInput,documentInput,dateInput,dealerNumberInput,dealerNameInput];
    required.forEach(el=>el.classList.toggle('missing',!el.value.trim()));
    const missing=required.filter(el=>!el.value.trim()).length;
    resultNotice.className='notice show '+(missing||!data.codes.length?'warn':'ok');
    resultNotice.textContent = missing||!data.codes.length
      ? `OCR 已完成，但有 ${missing} 個基本欄位空白，拍賣編號 ${data.codes.length} 筆。請依原圖確認並修正。`
      : `OCR 已完成，基本欄位皆有結果，拍賣編號 ${data.codes.length} 筆。送出前請再人工確認。`;
  }

  function renderCodes(codes) {
    codeList.innerHTML='';
    codes.forEach(addCodeRow);
    updateCodeCount();
  }
  function addCodeRow(value='') {
    const row=document.createElement('div'); row.className='code-item';
    const idx=document.createElement('span'); idx.className='code-index';
    const input=document.createElement('input'); input.value=value; input.autocomplete='off'; input.autocapitalize='characters'; input.spellcheck=false;
    const del=document.createElement('button'); del.type='button'; del.className='icon-btn'; del.textContent='×'; del.setAttribute('aria-label','刪除這筆拍賣編號');
    del.addEventListener('click',()=>{row.remove();renumberCodes();});
    row.append(idx,input,del); codeList.appendChild(row); renumberCodes();
    if(!value) input.focus();
  }
  function renumberCodes() {
    [...codeList.children].forEach((row,i)=>row.querySelector('.code-index').textContent=`${i+1}.`);
    updateCodeCount();
  }
  function updateCodeCount() { codeCount.textContent=`${codeList.children.length} 筆`; }
  function collectForm() {
    return {
      '市場名稱':marketInput.value.trim(),
      '文件名稱':documentInput.value.trim(),
      '拍賣日期':dateInput.value.trim(),
      '承銷人編號':dealerNumberInput.value.trim(),
      '承銷人姓名':dealerNameInput.value.trim(),
      '拍賣編號':[...codeList.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean)
    };
  }

  async function applyCorrectionAndOCR({ automatic = false } = {}) {
    try {
      setBusy(true);
      showProcessing('正在做透視校正…', 0.36, '校正會優先使用已載入的 OpenCV；若不可用則自動使用 JavaScript 備援。');
      await sleep(30);

      // 不在校正階段再次阻塞等待 OpenCV。自動偵測若已成功，cvApi 早已可用；
      // 若先前載入失敗，直接走 JS fallback，避免使用者第二次再等一輪。
      const cv = cvApi?.Mat ? cvApi : null;
      const fullFrameFastPath = autoDetection.method === 'template-frame' && isNearFullFrameQuad(corners);

      let warped = fullFrameFastPath
        ? resizeCanvasFast(sourceCanvas, NORMALIZED_WIDTH, NORMALIZED_HEIGHT)
        : cv
          ? warpPerspectiveOpenCV(cv, sourceCanvas, corners, NORMALIZED_WIDTH, NORMALIZED_HEIGHT)
          : warpPerspectiveJS(sourceCanvas, corners, NORMALIZED_WIDTH, NORMALIZED_HEIGHT);

      setProcessingStatus(
        '正在校正水平傾斜…',
        0.62,
        cv ? '利用文件表格水平線估算小角度傾斜。' : 'OpenCV 未就緒，本次略過自動水平線分析；仍可人工調整四角後重跑。'
      );
      let deskewAngle = 0;
      let finalCanvas = warped;
      if (cv) {
        deskewAngle = estimateHorizontalSkew(cv, warped);
        if (Math.abs(deskewAngle) >= 0.08 && Math.abs(deskewAngle) <= 4.5) {
          const rotated = rotateCanvasOpenCV(cv, warped, -deskewAngle);
          if (rotated !== warped) {
            finalCanvas = rotated;
            warped.width = 1;
            warped.height = 1;
          }
        } else {
          deskewAngle = 0;
        }
      }

      setProcessingStatus('正在建立標準化文件…', 0.78, '將文件統一成固定比例，接著會以固定 ROI 進行 OCR。');
      correctedCanvas.width = finalCanvas.width;
      correctedCanvas.height = finalCanvas.height;
      correctedCtx = correctedCanvas.getContext('2d', { alpha: false, willReadFrequently: true });
      correctedCtx.fillStyle = '#fff';
      correctedCtx.fillRect(0, 0, correctedCanvas.width, correctedCanvas.height);
      correctedCtx.drawImage(finalCanvas, 0, 0);
      if (finalCanvas !== warped) {
        finalCanvas.width = 1;
        finalCanvas.height = 1;
      } else {
        warped.width = 1;
        warped.height = 1;
      }

      autoDetection.deskewAngle = deskewAngle;
      const pct = autoDetection.confidence ? `，四角信心 ${Math.round(autoDetection.confidence * 100)}%` : '';
      const angleText = deskewAngle
        ? `，水平修正 ${(-deskewAngle).toFixed(2)}°`
        : cv
          ? '，水平線已檢查'
          : '，本次未執行自動水平線校正';
      const methodText = autoDetection.method === 'contour'
        ? '自動文件邊界偵測'
        : autoDetection.method === 'template-frame'
          ? '固定版型滿版偵測'
          : '人工四角校正';
      setAutoCorrectionInfo(
        automatic ? 'ok' : (autoDetection.confidence >= AUTO_REVIEW_CONFIDENCE ? 'ok' : 'warn'),
        `${methodText}${pct}${angleText}。若邊界不準，可按「重新調整四角」。`
      );

      correctedPreview.src = correctedCanvas.toDataURL('image/jpeg', 0.9);
      previewCard.classList.add('show');
      closeEditor();
      setProcessingStatus('文件校正完成', 1, '即將開始 OCR。');
      await sleep(60);
      hideProcessing();
      setBusy(false);
      await runOCR();
    } catch (err) {
      console.error(err);
      hideProcessing();
      setBusy(false);
      showError(err?.message || String(err));
    }
  }

  async function handleFile(file) {
    if (!file || isBusy) return;
    clearError();
    resultCard.classList.remove('show');
    previewCard.classList.remove('show');
    statusCard.classList.remove('show');
    setAutoCorrectionInfo('', '尚未校正');

    try {
      setBusy(true);
      showProcessing('正在載入照片…', 0.12, '照片只在目前瀏覽器頁面中處理。');
      await setSourceFromFile(file);

      setProcessingStatus(
        '正在自動偵測文件四角…',
        0.28,
        '先使用固定版型快速判斷；只有需要時才載入 OpenCV.js。'
      );
      const detection = await autoDetectDocument();

      if (detection && detection.confidence >= AUTO_APPLY_CONFIDENCE && !detection.quarterTurn) {
        setProcessingStatus('已偵測文件，正在自動校正…', 0.34, '自動結果可在完成後按「重新調整四角」修正。');
        await applyCorrectionAndOCR({ automatic: true });
        return;
      }

      hideProcessing();
      setBusy(false);
      openEditor();
      if (detection) {
        const pct = Math.round(detection.confidence * 100);
        editorTip.textContent = detection.quarterTurn
          ? `偵測到橫向文件（${pct}%）。請先確認方向，再微調四角後開始 OCR`
          : `已預先放好四角（信心 ${pct}%），請確認後開始 OCR`;
      } else {
        editorTip.textContent = '自動偵測信心不足，請拖曳 4 個圓點到文件四角';
      }
    } catch (err) {
      hideProcessing();
      setBusy(false);
      showError(err?.message || String(err));
    } finally {
      cameraInput.value = '';
      galleryInput.value = '';
    }
  }

  function resetForNext() {
    resultCard.classList.remove('show');
    previewCard.classList.remove('show');
    statusCard.classList.remove('show');
    setAutoCorrectionInfo('', '尚未校正');
    [marketInput,documentInput,dateInput,dealerNumberInput,dealerNameInput].forEach(el=>{el.value='';el.classList.remove('missing');});
    renderCodes([]);
    autoDetection = { method:'manual', confidence:0, deskewAngle:0, detail:'' };
    sourceCanvas.width = sourceCanvas.height = 1;
    correctedCanvas.width = correctedCanvas.height = 1;
    window.scrollTo({top:0,behavior:'smooth'});
  }

  takePhotoBtn.addEventListener('click',()=>{ warmOpenCVInBackground(); cameraInput.click(); });
  choosePhotoBtn.addEventListener('click',()=>{ warmOpenCVInBackground(); galleryInput.click(); });
  cameraInput.addEventListener('change',e=>handleFile(e.target.files?.[0]));
  galleryInput.addEventListener('change',e=>handleFile(e.target.files?.[0]));
  editorCloseBtn.addEventListener('click',closeEditor);
  rotateLeftBtn.addEventListener('click',()=>rotateSource(false));
  rotateRightBtn.addEventListener('click',()=>rotateSource(true));
  resetCornersBtn.addEventListener('click',()=>{
    resetCorners();
    autoDetection = { method: 'manual', confidence: 0, deskewAngle: 0, detail: '使用者重設四角。' };
    editorTip.textContent = '已重設四角，請拖曳 4 個圓點到文件四角';
  });
  autoDetectBtn.addEventListener('click',async()=>{
    if(isBusy || !sourceCanvas.width) return;
    clearError();
    try {
      setBusy(true);
      showProcessing(
        '正在重新偵測文件四角…',
        0.28,
        `這次會重新嘗試 OpenCV.js；最長等待約 ${Math.round(OPENCV_TOTAL_TIMEOUT_MS / 1000)} 秒。`
      );
      const detection = await autoDetectDocument({ keepEditorOpen:true, forceOpenCVRetry:true });
      hideProcessing();
      setBusy(false);
      if(!detection) showError('未找到可靠的文件邊界，請手動拖曳四角。');
    } catch(err) {
      hideProcessing();
      setBusy(false);
      showError(err?.message || String(err));
    }
  });
  applyCorrectionBtn.addEventListener('click',applyCorrectionAndOCR);
  editAgainBtn.addEventListener('click',openEditor);
  recognizeAgainBtn.addEventListener('click',runOCR);
  addCodeBtn.addEventListener('click',()=>addCodeRow(''));
  newScanBtn.addEventListener('click',resetForNext);
  copyJsonBtn.addEventListener('click',async()=>{
    const text=JSON.stringify(collectForm(),null,2);
    try { await navigator.clipboard.writeText(text); copyJsonBtn.textContent='已複製'; }
    catch { const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copyJsonBtn.textContent='已複製'; }
    setTimeout(()=>copyJsonBtn.textContent='複製 JSON',1200);
  });

  window.addEventListener('pagehide',()=>{
    if(worker) worker.terminate();
    if(correctedPreviewUrl && correctedPreviewUrl.startsWith('blob:')) URL.revokeObjectURL(correctedPreviewUrl);
  });
})();
</script>
