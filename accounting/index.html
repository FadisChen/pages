<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳 APP</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰️</text></svg>" type="image/svg+xml">
    <script src="auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(255, 255, 255, 0.1)',
                        'glass-border': 'rgba(255, 255, 255, 0.2)',
                        'glass-bg': 'rgba(255, 255, 255, 0.05)',
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="index.css" />
</head>
<body class="font-sans text-white">
    <div class="auth-overlay" id="authOverlay" hidden>
        <section class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle" aria-describedby="authCopy">
            <form class="auth-form" id="authForm" autocomplete="on">
                <label class="auth-field" for="authUsername">
                    <span>帳號 / User ID</span>
                    <input id="authUsername" name="username" type="text" autocomplete="username" required>
                </label>
                <label class="auth-field" for="authPassword">
                    <span>密碼 / Password</span>
                    <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
                </label>
                <button class="auth-submit" id="authSubmit" type="submit">登入 ↗</button>
                <p class="auth-error" id="authError" role="alert" hidden></p>
            </form>
        </section>
    </div>
    <div class="container mx-auto px-4 py-6 max-w-md">
        <!-- Header -->
        <header class="glass rounded-3xl p-6 mb-6 text-center">            
            <!-- Month Navigation -->
            <div class="flex items-center justify-between mb-4">
                <button id="prevMonth" class="glass-card rounded-full p-3 hover:bg-white/20 transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h2 id="currentMonth" class="text-xl font-semibold">2024年01月</h2>
                <button id="nextMonth" class="glass-card rounded-full p-3 hover:bg-white/20 transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <!-- Monthly Total -->
            <div class="glass-card rounded-2xl p-4">
                <p class="text-sm opacity-80">本月支出總計</p>
                <p id="monthlyTotal" class="text-3xl font-bold">$0</p>
            </div>
        </header>

        <!-- Add New Record Section -->
        <section class="glass rounded-3xl p-6 mb-6">
            <h3 class="text-lg font-semibold mb-4">新增支出記錄</h3>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="expenseDate" class="glass-input rounded-xl p-3 text-white placeholder-white/70" />
                    <div id="itemNamePicker" class="recent-item-picker">
                        <input type="text" id="itemName" placeholder="項目名稱" class="glass-input rounded-xl p-3 w-full text-white placeholder-white/70" autocomplete="off" aria-autocomplete="list" aria-controls="recentItemsList" aria-expanded="false" />
                        <div id="recentItemsList" class="recent-items-list" role="listbox" hidden></div>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <select id="expenseType" class="glass-input rounded-xl p-3 text-white" style="color-scheme: dark;">
                        <option value="吃喝" style="background: #f8f9fa; color: #333;">吃喝</option>
                        <option value="購物" style="background: #f8f9fa; color: #333;">購物</option>
                        <option value="住宿" style="background: #f8f9fa; color: #333;">住宿</option>
                        <option value="交通" style="background: #f8f9fa; color: #333;">交通</option>
                        <option value="學習" style="background: #f8f9fa; color: #333;">學習</option>
                        <option value="娛樂" style="background: #f8f9fa; color: #333;">娛樂</option>
                    </select>
                    <select id="paymentMethod" class="glass-input rounded-xl p-3 text-white" style="color-scheme: dark;">
                        <option value="現金" style="background: #f8f9fa; color: #333;">現金</option>
                        <option value="信用卡" style="background: #f8f9fa; color: #333;">信用卡</option>
                    </select>
                </div>
                
                <input type="number" id="amount" placeholder="金額" class="glass-input rounded-xl p-3 w-full text-white placeholder-white/70" />
                
                <div class="flex gap-3">
                    <button id="addRecord" class="flex-1 glass-card rounded-xl p-3 font-semibold hover:bg-white/20 transition-all">
                        新增記錄
                    </button>
                    <button id="voiceInput" class="glass-card rounded-xl p-3 hover:bg-white/20 transition-all" title="語音輸入">
                        🎤
                    </button>
                </div>
            </div>
        </section>
        
        <!-- Statistics Chart -->
        <section class="glass rounded-3xl p-6 mb-6">
            <h3 class="text-lg font-semibold mb-4">消費類型統計</h3>
            <div class="h-64">
                <canvas id="expenseChart"></canvas>
            </div>
        </section>

        <!-- Expense List -->
        <section class="glass rounded-3xl p-6">
            <h3 class="text-lg font-semibold mb-4">支出清單</h3>
            <div id="expenseList" class="space-y-3">
                <!-- Expense items will be dynamically added here -->
            </div>
        </section>

        <!-- Voice Recording Modal -->
        <div id="voiceModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
            <div class="glass-card rounded-3xl p-8 m-4 max-w-sm w-full text-center">
                <div id="recordingIndicator" class="mb-6">
                    <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-red-500/30 flex items-center justify-center">
                        <div class="w-8 h-8 rounded-full bg-red-500 animate-pulse"></div>
                    </div>
                    <p class="text-lg">正在聆聽...</p>
                    <p class="text-sm opacity-70">請說出您的消費記錄</p>
                </div>
                <button id="stopRecording" class="glass-card rounded-xl px-6 py-3 hover:bg-white/20 transition-all">
                    停止聆聽
                </button>
            </div>
        </div>

        <!-- Loading Modal -->
        <div id="loadingModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
            <div class="glass-card rounded-3xl p-8 m-4 max-w-sm w-full text-center">
                <div class="w-16 h-16 mx-auto mb-4">
                    <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-white"></div>
                </div>
                <p class="text-lg">處理中...</p>
            </div>
        </div>

        <!-- 自定義警告彈出視窗 -->
        <div id="alertModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
            <div class="glass-card rounded-3xl p-8 m-4 max-w-md w-full text-center">
                <div class="mb-6">
                    <div id="alertIcon" class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center">
                        <!-- 圖示將由 JavaScript 動態設定 -->
                    </div>
                    <h3 id="alertTitle" class="text-xl font-bold mb-2">提示</h3>
                    <p id="alertMessage" class="text-base opacity-90"></p>
                </div>
                <button id="alertConfirm" class="glass-card w-full py-3 px-6 rounded-2xl font-medium hover:bg-white/20 transition-all">
                    確定
                </button>
            </div>
        </div>

        <!-- 自定義確認彈出視窗 -->
        <div id="confirmModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
            <div class="glass-card rounded-3xl p-8 m-4 max-w-md w-full text-center">
                <div class="mb-6">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-orange-500/20 flex items-center justify-center">
                        <svg class="w-8 h-8 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.962-.833-2.732 0L4.082 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                    <h3 id="confirmTitle" class="text-xl font-bold mb-2">確認操作</h3>
                    <p id="confirmMessage" class="text-base opacity-90"></p>
                </div>
                <div class="flex gap-3">
                    <button id="confirmCancel" class="flex-1 py-3 px-6 rounded-2xl font-medium bg-white/10 hover:bg-white/20 transition-all">
                        取消
                    </button>
                    <button id="confirmOk" class="flex-1 py-3 px-6 rounded-2xl font-medium bg-red-500/30 hover:bg-red-500/50 transition-all">
                        確認
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
