    function lodgingMarkup(d){const active=d.stay.includes('釜山')?'busan':'daegu';return `<h2 class="section-title">住宿基地</h2><div class="lodging-grid"><article class="lodging ${active==='busan'?'active':''}"><h3>${lodging.busan.name}</h3><p>${lodging.busan.sub}</p><p class="small">${lodging.busan.detail}</p><div class="event-links"><a class="map-link" href="https://www.google.com/maps/place/Shire+Hotel/data=!4m7!3m6!1s0x3568eb00544bf535:0xb5c43ca6d5b15094!5m2!4m1!1i2!16s%2Fg%2F11ltskrl5t!20s8Q7F428Q%2BXXXH6Q3?authuser=0&amp;entry=ttu&amp;g_ep=EgoyMDI2MDkyOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener">Google Maps</a><a class="map-link naver" href="${naver('샤이어호텔 부산역')}" target="_blank" rel="noopener">Naver Map</a><a class="map-link" href="https://www.booking.com/hotel/kr/syaieohotel-busanyeog-busan.zh-tw.html?checkin=2026-10-28&amp;checkout=2026-10-30" target="_blank" rel="noopener">飯店資訊（Booking）</a></div></article><article class="lodging ${active==='daegu'?'active':''}"><h3>${lodging.daegu.name}</h3><p>${lodging.daegu.sub}</p><p class="small">${lodging.daegu.detail}</p><div class="event-links"><a class="map-link" href="${search('中央路站 大邱')}" target="_blank" rel="noopener">Google Maps</a><a class="map-link naver" href="${naver('中央路站 大邱住宿')}" target="_blank" rel="noopener">Naver Map</a></div></article></div>`}
    function eventMarkup(e,i){return `<article class="item"><div class="time">${e.time}</div><div class="event" style="animation-delay:${Math.min(i*.025,.2)}s"><h3>${e.title}</h3><div class="meta"><span>🚇 <b>${e.mode}</b></span><span>📍 ${e.where}</span>${e.price&&e.price!=='—'?`<span class="fare">${e.price}</span>`:''}</div>${e.detail?`<p class="tip">${e.detail}</p>`:''}${e.from&&e.to?`<div class="event-links"><a class="map-link" href="${gmap(e.from,e.to)}" target="_blank" rel="noopener">Google Maps 路線</a><a class="map-link naver" href="${naver(e.from+' → '+e.to)}" target="_blank" rel="noopener">Naver 即時路線</a></div>`:''}</div></article>`}

    function render(){const d=days[selected];tabs.innerHTML=days.map((x,i)=>`<button class="tab" role="tab" aria-selected="${i===selected}" data-i="${i}">${x.label}<span>週${x.week} · ${x.city.split(' ')[0]}</span></button>`).join('');content.innerHTML=`<section class="summary"><div class="dayline">DAY ${selected+1} · 週${d.week}</div><h2>${d.title}</h2><p>${d.city}</p><div class="mini"><span class="chip">⌁ ${d.weather}</span><span class="chip">⌂ ${d.stay}</span></div></section><aside class="notice"><span>✦</span><div><strong>今天提醒</strong>${d.note}</div></aside>${lodgingMarkup(d)}<h2 class="section-title">時間表（上車位置・票價）</h2><div class="timeline">${d.events.map(eventMarkup).join('')}</div>${mapCard(d)}${foodMarkup(d)}<h2 class="section-title">快速工具</h2><div class="actions"><a class="action" href="${search(d.city)}" target="_blank" rel="noopener">Google Maps 搜尋</a><a class="action" href="#top" id="top">回到頂部</a></div><p class="sources">票價以成人交通卡約值整理：<a href="https://www2.humetro.busan.kr/homepage/chs/page/subLocation.do?menu_no=1001010501" target="_blank" rel="noopener">釜山地鐵</a> · <a href="https://welcome-busan.com/guide/transport/busan-city-bus-guide/" target="_blank" rel="noopener">釜山市內巴士</a> · <a href="https://nowboarding.kr/airport/tae/bus/401" target="_blank" rel="noopener">大邱機場 401</a> · <a href="https://its.gyeongju.go.kr/EN/busCharge.do" target="_blank" rel="noopener">慶州公車票價</a> · <a href="https://main.bluelinepark.com/eng/skyCapsuleCourse.do" target="_blank" rel="noopener">膠囊列車官方路線／車程</a> · <a href="https://main.bluelinepark.com/eng/faqList.do" target="_blank" rel="noopener">藍線公園搭乘須知</a>。時間表為規劃估算，已預約膠囊列車時段固定；實際班次、道路與票價請於出發前再次確認。</p>`;tabs.querySelector('[aria-selected=true]').scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});const top=$('#top');if(top)top.onclick=e=>{e.preventDefault();scrollTo({top:0,behavior:'smooth'})}}
